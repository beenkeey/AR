<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Quarry preview QA</title>
  <style>
    html, body { margin: 0; background: #111; color: #eee; font: 14px/1.4 system-ui; }
    #wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
    canvas { width: 100%; height: auto; background: #222; border: 1px solid #444; }
    h1 { margin: 8px 12px; font-size: 16px; }
    .label { padding: 4px 8px; }
    #checks { margin: 8px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>Quarry visual QA — Бровка / Дно / Обзор / БелАЗ</h1>
  <pre id="checks">loading…</pre>
  <div id="wrap"></div>
  <script type="module">
    import * as THREE from 'three';
    import { ExhibitionScene } from './src/ar/ExhibitionScene.js';
    import { createCoalMineComplex } from './src/assets/CoalMineComplex.js';

    const scene = new ExhibitionScene();
    const model = createCoalMineComplex();
    scene.attach(model);
    scene.placeStatic();
    scene.setOpacity(1);
    scene.restoreMaterials();

    const views = ['front', 'bottom', 'overlook', 'belaz', 'dig'];
    const wrap = document.getElementById('wrap');
    const checks = [];

    // Structural checks
    const complex = model;
    const contactInComplex = !!complex.getObjectByName('ContactShadow');
    const contactInAnchor = !!scene.anchor.getObjectByName('ContactShadow');
    const lights = !!complex.getObjectByName('IndustrialLights');
    const rim = scene.scene.getObjectByName('RimInfrastructure');
    let minBaseR = Infinity;
    let spherePiles = 0;
    rim?.traverse((n) => {
      if (!n.isMesh) return;
      if (n.geometry?.type === 'SphereGeometry') spherePiles += 1;
      const p = new THREE.Vector3();
      n.getWorldPosition(p);
      const o = scene.world._quarryOrigin;
      const r = Math.hypot(p.x - o.x, p.z - o.z);
      // skip berm (torus around rim)
      if (n.geometry?.type === 'TorusGeometry') return;
      if (r > 85) minBaseR = Math.min(minBaseR, r);
    });

    const vp = Object.fromEntries(scene.viewpoints.map((v) => [v.id, v]));
    const o = scene.world._quarryOrigin;
    const heightAt = scene.world?.terrain?.userData?.heightAt;
    const pitFloor = heightAt ? heightAt(0) : -28.5;
    const bottomOk = vp.bottom
      && Math.hypot(vp.bottom.position.x - o.x, vp.bottom.position.z - o.z) < 0.5
      && vp.bottom.position.y < -20;
    const onlyFour = scene.viewpoints.length === 4
      && ['front', 'bottom', 'overlook', 'belaz'].every((id) => scene.viewpoints.some((v) => v.id === id));

    checks.push(`ContactShadow in complex: ${contactInComplex ? 'FAIL' : 'ok'}`);
    checks.push(`ContactShadow on anchor: ${contactInAnchor ? 'FAIL' : 'ok'}`);
    checks.push(`IndustrialLights: ${lights ? 'FAIL' : 'ok'}`);
    checks.push(`Rim base min radius (meshes >85): ${minBaseR.toFixed(1)} (want ≥95)`);
    checks.push(`Sphere coal piles in rim: ${spherePiles}`);
    checks.push(`Viewpoints exactly 4 (бровка/дно/обзор/белаз): ${onlyFour ? 'ok' : 'FAIL'} → ${scene.viewpoints.map((v) => v.id).join(',')}`);
    checks.push(`Дно at quarry center + deep: ${bottomOk ? 'ok' : 'FAIL'} y=${vp.bottom?.position.y?.toFixed(2)}`);
    checks.push(`Colliders empty: ${scene.colliders.length === 0 ? 'ok' : 'FAIL'}`);

    const haul = scene.world?.terrain?.userData?.haul;
    const climb = haul ? haul.yMax - haul.yMin : 0;
    checks.push(`Haul climb ${climb.toFixed(1)} m, r ${haul?.rMin?.toFixed(1)}–${haul?.rMax?.toFixed(1)} (want climb>15, r 12–77)`);
    const haulOk = haul && climb > 15 && haul.rMin > 12 && haul.rMax < 77;
    checks.push(`Haul stays in the pit and climbs: ${haulOk ? 'ok' : 'FAIL'}`);

    function settle(sec) {
      const step = 0.05;
      for (let t = step; t <= sec; t += step) scene.tick(t * 1000);
      scene.tick(sec * 1000);
    }

    const ys = [];
    const radii = [];
    for (const sec of [5, 25, 50, 75]) {
      settle(sec);
      for (const truck of scene.world.trucks) {
        ys.push(truck.group.position.y);
        radii.push(Math.hypot(truck.group.position.x - o.x, truck.group.position.z - o.z));
      }
    }
    const truckClimb = Math.max(...ys) - Math.min(...ys);
    checks.push(`BelAZ height range over loop: ${truckClimb.toFixed(1)} (want >15)`);
    checks.push(`BelAZ radius range: ${Math.min(...radii).toFixed(1)}–${Math.max(...radii).toFixed(1)}`);
    const faceDots = scene.world.trucks.map((t) => {
      const f = new THREE.Vector3(1, 0, 0).applyQuaternion(t.group.quaternion);
      const m = t._next.clone().sub(t._pos);
      m.y = 0;
      return f.dot(m.normalize());
    });
    checks.push(`BelAZ nose along travel (1 = forward): ${faceDots.map((d) => d.toFixed(2)).join(', ')}`);
    checks.push(`Trucks: ${scene.world.trucks.length}`);
    const sites = scene.world.terrain.userData.coalSites || [];
    checks.push(`Coal dig faces: ${sites.length} (want 2)`);
    const mesh = scene.world.terrain.children.find((n) => n.geometry?.attributes?.color);
    const pos = mesh.geometry.attributes.position;
    const col = mesh.geometry.attributes.color;
    let dark = 0;
    let seen = 0;
    for (const site of sites) {
      const radial = new THREE.Vector3(Math.cos(site.ang), 0, Math.sin(site.ang));
      const ex = scene.world.excavators.find((item) => {
        const dx = item.position.x - o.x - Math.cos(site.ang) * site.standR;
        const dz = item.position.z - o.z - Math.sin(site.ang) * site.standR;
        return dx * dx + dz * dz < 1;
      });
      const fwd = new THREE.Vector3(1, 0, 0).applyQuaternion(ex.quaternion);
      fwd.y = 0;
      fwd.normalize();
      checks.push(`Shovel yaw ${ex.rotation.y.toFixed(2)} vs face ${site.ang.toFixed(2)}, dot ${fwd.dot(radial).toFixed(2)}, road ${site.score.toFixed(1)}`);
      for (let i = 0; i < pos.count; i += 1) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const r = Math.hypot(x, z);
        const a = Math.atan2(z, x);
        const da = Math.atan2(Math.sin(a - site.ang), Math.cos(a - site.ang));
        if (Math.abs(da) < 0.22 && Math.abs(r - (site.faceR + 1)) < 1.4) {
          seen += 1;
          const lum = col.getX(i) + col.getY(i) + col.getZ(i);
          if (lum < 0.45) dark += 1;
        }
      }
    }
    checks.push(`Coal-colored face verts: ${dark}/${seen} (want most of them dark)`);
    document.getElementById('checks').textContent = checks.join('\n');

    const W = 640;
    const H = 400;
    for (const id of views) {
      const view = id === 'dig' ? { id: 'dig', label: 'Ковш', position: new THREE.Vector3() } : scene.getViewpoint(id);
      const cell = document.createElement('div');
      const label = document.createElement('div');
      label.className = 'label';
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const cam = new THREE.PerspectiveCamera(55, W / H, 0.5, 500);
      const poseSec = id === 'belaz' ? 12 : 8;
      settle(poseSec);
      if (id === 'belaz') {
        const eye = scene.getFollowEye(new THREE.Vector3());
        const truck = scene.world.followTruck.group;
        if (eye) cam.position.copy(eye);
        else cam.position.copy(view.position);
        const ahead = new THREE.Vector3(14, 0.4, 0.2)
          .applyQuaternion(truck.quaternion)
          .add(truck.position);
        cam.lookAt(ahead);
      } else if (id === 'bottom') {
        cam.position.copy(view.position);
        // Look across toward a mid bench (inward-facing walls stay solid)
        cam.lookAt(o.x + 38, -12, o.z);
      } else if (id === 'overlook') {
        cam.position.copy(view.position);
        cam.lookAt(o.x, -8, o.z);
      } else if (id === 'dig') {
        const ex = scene.world.excavators[0];
        const eye = new THREE.Vector3(3.4, 3.4, 8.5).applyQuaternion(ex.quaternion).add(ex.position);
        cam.position.copy(eye);
        const look = new THREE.Vector3(6.6, 1.2, 0).applyQuaternion(ex.quaternion).add(ex.position);
        cam.lookAt(look);
        view.position.copy(eye);
      } else {
        cam.position.copy(view.position);
        cam.lookAt(o.x, -10, o.z);
      }
      label.textContent = `${view.label} (${id})  pos ${cam.position.x.toFixed(1)}, ${cam.position.y.toFixed(1)}, ${cam.position.z.toFixed(1)}`;
      renderer.render(scene.scene, cam);
      cell.append(label, renderer.domElement);
      wrap.appendChild(cell);
    }

    document.title = 'Quarry preview QA ready';
  </script>
</body>
</html>
