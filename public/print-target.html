<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Печать AR-таргета</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: sans-serif; }
      main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
      img { width: 100%; height: auto; border: 1px solid #ccc; }
      p { line-height: 1.4; }
      @media print { h1, p { display: none; } img { border: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Печатный image-target</h1>
      <p>
        Распечатайте это изображение (желательно не меньше 15–20 см) и закрепите его на физической буровой
        или рядом с ней. Stage 1 использует его как одноразовый визуальный триггер.
      </p>
      <img src="./assets/targets/rig-target.png" alt="Rig AR target" />
    </main>
  </body>
</html>
