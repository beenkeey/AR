<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Печать AR-маркера карьера</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: sans-serif; color: #111; }
      main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
      img { width: 100%; height: auto; border: 1px solid #ccc; }
      p, li { line-height: 1.45; }
      .warn {
        background: #fff6d8;
        border: 1px solid #e6c65c;
        border-radius: 10px;
        padding: 12px 14px;
      }
      @media print {
        h1, p, li, .warn, .noprint { display: none !important; }
        img { border: 0; max-width: 16cm; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Маркер угольного карьера</h1>
      <div class="warn noprint">
        <strong>Важно:</strong> QR только открывает сайт.
        Наведите камеру на <em>эту</em> распечатку (~15–20&nbsp;см), не на QR.
      </div>
      <p class="noprint">
        AR: <a href="./">главная</a> · QR: <code>assets/targets/coal-quarry-qr.png</code>
      </p>
      <img src="./assets/targets/coal-quarry-marker.png" alt="Coal quarry AR marker" />
    </main>
  </body>
</html>
