<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Контрольный MindAR target</title>
    <style>
      html, body { margin: 0; background: #fff; font-family: sans-serif; }
      main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
      img { width: 100%; height: auto; border: 1px solid #ccc; }
      p { line-height: 1.4; }
      @media print { h1, p { display: none; } img { border: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Контрольный image target (MindAR card example)</h1>
      <p>
        Покажите это изображение на мониторе или распечатайте. Для A/B-теста откройте приложение с
        <code>?debug=1&amp;target=test</code>.
      </p>
      <img src="/assets/targets/mindar-card-test.png" alt="MindAR control target" />
    </main>
  </body>
</html>
